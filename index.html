<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Israel NOTAMs</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-muted: #62697a;
    --accent: #1a5fb4;
    --badge-bg: #eef2f8;
    --warn-bg: #fff4e5;
    --warn-border: #f0c36d;
    --mono-bg: #f2f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f26;
      --border: #2c303a;
      --text: #e7e9ee;
      --text-muted: #9aa1b0;
      --accent: #6fa8ff;
      --badge-bg: #23283333;
      --badge-bg: #262b36;
      --warn-bg: #3a2f16;
      --warn-border: #7a5b1e;
      --mono-bg: #12151a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 1rem;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin: 0 0 1rem;
  }
  .disclaimer {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 0.65rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 1rem;
  }
  .controls {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 1rem;
  }
  #search {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 0.4rem;
  }
  .notam-id {
    font-weight: 700;
    font-size: 1.05rem;
  }
  .badges {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .badge {
    background: var(--badge-bg);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
    font-size: 0.75rem;
    white-space: nowrap;
  }
  .badge.accent { color: var(--accent); }
  .validity {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .e-text {
    font-size: 0.92rem;
    white-space: pre-wrap;
  }
  .limits {
    margin-top: 0.5rem;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  details {
    margin-top: 0.6rem;
    font-size: 0.8rem;
  }
  summary {
    cursor: pointer;
    color: var(--accent);
  }
  pre.raw {
    background: var(--mono-bg);
    border-radius: 6px;
    padding: 0.6rem 0.75rem;
    overflow-x: auto;
    font-size: 0.78rem;
    margin: 0.5rem 0 0;
  }
  .empty, .error {
    color: var(--text-muted);
    text-align: center;
    padding: 2rem 1rem;
  }
  a { color: var(--accent); }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<header>
  <h1>Israel NOTAMs</h1>
  <p class="subtitle">Unofficial republish of the IAA live NOTAM feed as JSON.</p>
  <div class="disclaimer">Informational only. Not a substitute for an official pre-flight briefing.</div>
  <div class="meta-row">
    <span id="generated">Loading…</span>
    <span id="count"></span>
  </div>
</header>
<div class="controls">
  <input id="search" type="search" placeholder="Filter by NOTAM ID, location, or text…" autocomplete="off" />
</div>
<main id="list">
  <div class="empty">Loading NOTAMs…</div>
</main>
<footer>
  Data source: <a href="https://ext.iaa.gov.il/aeroinfo/AeroInfo.aspx?msgType=Notam" target="_blank" rel="noopener">IAA AeroInfo</a>
  &middot; Raw JSON: <a href="./notams.json">notams.json</a>
  &middot; <a href="https://github.com/arielf-idra/notam-isr" target="_blank" rel="noopener">Source on GitHub</a>
</footer>
<script>
function fmtUtc(iso) {
  if (!iso) return 'unknown';
  return iso.replace('T', ' ').replace('Z', ' UTC');
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return `${hrs} hr ago`;
  return `${Math.round(hrs / 24)} days ago`;
}

function renderCard(n) {
  const badges = [];
  if (n.location) badges.push(`<span class="badge">${n.location}</span>`);
  if (!n.fullTextAvailable) badges.push(`<span class="badge">preview only</span>`);
  if (n.position) badges.push(`<span class="badge accent">${n.position.source === 'e_text' ? 'precise position' : 'approx. position'}</span>`);

  const validity = (n.fromDate || n.toDate)
    ? `Valid ${fmtUtc(n.fromDate)} &rarr; ${fmtUtc(n.toDate)}`
    : '';

  const limits = (n.lowerLimit || n.upperLimit)
    ? `<div class="limits">Limits: ${n.lowerLimit || '?'} &ndash; ${n.upperLimit || '?'}</div>`
    : '';

  const position = n.position
    ? `<div class="limits">Position: ${n.position.lat.toFixed(5)}, ${n.position.lon.toFixed(5)}${n.position.radiusNm != null ? ` (radius ${n.position.radiusNm} NM)` : ''}</div>`
    : '';

  return `
    <article class="card" data-search="${(n.id + ' ' + n.location + ' ' + (n.eText || '')).toLowerCase().replace(/"/g, '&quot;')}">
      <div class="card-head">
        <span class="notam-id">${n.id}</span>
        <div class="badges">${badges.join('')}</div>
      </div>
      <div class="validity">${validity}</div>
      <div class="e-text">${(n.eText || '(no text available)').replace(/</g, '&lt;')}</div>
      ${limits}
      ${position}
      <details>
        <summary>Raw ICAO text</summary>
        <pre class="raw">${(n.rawText || '').replace(/</g, '&lt;')}</pre>
      </details>
    </article>
  `;
}

async function main() {
  const listEl = document.getElementById('list');
  let data;
  try {
    const res = await fetch('./notams.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    listEl.innerHTML = `<div class="error">Failed to load notams.json: ${err.message}</div>`;
    return;
  }

  document.getElementById('generated').textContent =
    `Last updated: ${fmtUtc(data.generatedAt)} (${timeAgo(data.generatedAt)})`;
  document.getElementById('count').textContent = `${data.count} active NOTAM${data.count === 1 ? '' : 's'}`;

  if (!data.notams || data.notams.length === 0) {
    listEl.innerHTML = '<div class="empty">No NOTAMs found.</div>';
    return;
  }

  const sorted = [...data.notams].sort((a, b) => (a.fromDate || '').localeCompare(b.fromDate || ''));
  listEl.innerHTML = sorted.map(renderCard).join('');

  const cards = Array.from(listEl.querySelectorAll('.card'));
  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    let visible = 0;
    for (const card of cards) {
      const match = !q || card.dataset.search.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visible++;
    }
  });
}

main();
</script>
</body>
</html>
