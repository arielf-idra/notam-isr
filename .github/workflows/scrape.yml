name: Scrape IAA NOTAMs

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-notams
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # scrape.mjs only writes notams.json on success (row count above a sanity
      # threshold) and exits non-zero on any failure, so a failed/suspicious
      # run stops here and never touches the committed file.
      - name: Scrape NOTAMs
        run: npm run scrape

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- notams.json; then
            echo "No changes to notams.json, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notams.json
          git commit -m "chore: update notams.json ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push
